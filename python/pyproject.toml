[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ngris"
version = "0.1.0"
description = "Python SDK for the Ngris edge gateway platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Ngris", email = "sdk@ngris.io" }]
keywords = ["ngris", "tunnel", "edge-gateway", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # httpx[http2] pulls the optional `h2` package so HTTP/2 is available
    # out of the box. Multiplexed streams cut head-of-line blocking on
    # paginated list calls and concurrent service usage.
    "httpx[http2]>=0.27,<1",
    "pydantic>=2.0,<3",
]

# Surface the changelog on PyPI so users can find migration notes from
# the project page without round-tripping through GitHub.
[project.urls]
Homepage = "https://ngris.io"
Documentation = "https://ngris.io/api"
Changelog = "https://github.com/ngris-edge/ngris-python/blob/main/CHANGELOG.md"
Repository = "https://github.com/ngris-edge/ngris-python"
Issues = "https://github.com/ngris-edge/ngris-python/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ngris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
